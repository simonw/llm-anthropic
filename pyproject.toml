[project]
name = "llm-anthropic"
version = "0.27"
description = "LLM access to models by Anthropic, including the Claude series"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = []
dependencies = [
    "llm>=0.33",
    "anthropic>=1,<2",
]

[project.urls]
Homepage = "https://github.com/simonw/llm-anthropic"
Changelog = "https://github.com/simonw/llm-anthropic/releases"
Issues = "https://github.com/simonw/llm-anthropic/issues"
CI = "https://github.com/simonw/llm-anthropic/actions"

[project.entry-points.llm]
anthropic = "llm_anthropic"

[dependency-groups]
dev = [
    "pytest",
    "pytest-recording",
    # vcrpy 8.3+ can record/replay httpx2, used by anthropic>=1
    "vcrpy>=8.3",
    "pytest-asyncio",
    "cogapp",
    "inline-snapshot[black]",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
