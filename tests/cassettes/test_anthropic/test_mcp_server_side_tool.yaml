        repository, `simonw/llm`, provides a command-line interface (CLI) tool and
        a Python library for interacting with various Large Language Models (LLMs)
        from providers like OpenAI, Anthropic, and Google, as well as local models
        \ . It allows you to run prompts, manage API keys, store interactions in SQLite
        databases, generate embeddings, and extend functionality through a plugin
        system  .\\n\\n## Core Functionality\\n\\nThe `llm` tool offers several key
        features:\\n*   **Prompt Execution**: You can run prompts directly from the
        command line  or programmatically using the Python API .\\n*   **Model Support**:
        It supports a wide range of models, including those from OpenAI, Anthropic,
        Google, and local models, with extensibility for others via plugins  .\\n*
        \  **Data Storage**: All interactions, including prompts and responses, are
        persistently logged to SQLite databases (`logs.db`)  . It also supports generating
        and storing embeddings in `embeddings.db`  .\\n*   **Plugin System**: A robust
        plugin system allows for extending the tool's capabilities by adding new models,
        embedding models, tools, CLI commands, and template/fragment loaders .\\n*
        \  **Tools and Schemas**: LLM enables models to execute Python functions as
        \\\"tools\\\"  and supports structured output extraction using schemas .\\n*
        \  **Conversations**: The tool facilitates multi-turn conversations with models
        .\\n\\n## Installation and Usage\\nYou can install LLM using `pip`, Homebrew,
        `pipx`, or `uv` . After installation, you can set up API keys for various
        providers  and start interacting with models from your terminal .\\n\\n##
        Notes\\nThe `pyproject.toml` file  provides metadata about the project, including
        its name (`llm`), version (`0.28`), description, authors, license, and dependencies
        . The `README.md`  and `docs/index.md`  files serve as the primary documentation
        for the project, outlining its features and providing quick start guides.
        The `docs/changelog.md`  details the version history and new features.\\n\\nWiki
        pages you might want to explore:\\n- [Overview (simonw/llm)](/wiki/simonw/llm#1)\\n-
        [Plugin System (simonw/llm)](/wiki/simonw/llm#4)\\n\\nView this search on
